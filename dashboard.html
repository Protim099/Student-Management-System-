<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Student Management System</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Navbar -->
<nav class="bg-indigo-600 text-white shadow">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="font-bold text-lg">🎓 Student Management System</div>
    <div class="flex items-center gap-4">
      <span id="userLabel" class="text-sm opacity-90"></span>
      <button id="logoutBtn" class="bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-lg text-sm">লগআউট</button>
    </div>
  </div>
</nav>

<main class="max-w-6xl mx-auto p-4 md:p-6">

  <!-- Stats -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
    <div class="bg-white rounded-xl shadow p-5">
      <p class="text-gray-500 text-sm">মোট স্টুডেন্ট</p>
      <p id="statTotal" class="text-3xl font-bold text-indigo-600 mt-1">-</p>
    </div>
    <div class="bg-white rounded-xl shadow p-5 sm:col-span-2">
      <p class="text-gray-500 text-sm mb-2">ডিপার্টমেন্ট অনুযায়ী</p>
      <div id="statDept" class="flex flex-wrap gap-2 text-sm"></div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="flex flex-col sm:flex-row gap-3 justify-between items-stretch sm:items-center mb-4">
    <input id="searchInput" type="text" placeholder="নাম, রোল বা ডিপার্টমেন্ট দিয়ে সার্চ করুন..."
      class="border border-gray-300 rounded-lg px-4 py-2 w-full sm:w-80 focus:ring-2 focus:ring-indigo-500 outline-none">
    <button id="addStudentBtn"
      class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium whitespace-nowrap">
      + নতুন স্টুডেন্ট যোগ করুন
    </button>
  </div>

  <!-- Table -->
  <div class="bg-white rounded-xl shadow overflow-x-auto">
    <table class="w-full text-sm text-left">
      <thead class="bg-gray-100 text-gray-600 uppercase text-xs">
        <tr>
          <th class="px-4 py-3">Roll</th>
          <th class="px-4 py-3">নাম</th>
          <th class="px-4 py-3">ডিপার্টমেন্ট</th>
          <th class="px-4 py-3">সেমিস্টার</th>
          <th class="px-4 py-3">ইমেইল</th>
          <th class="px-4 py-3">ফোন</th>
          <th class="px-4 py-3 text-right">অ্যাকশন</th>
        </tr>
      </thead>
      <tbody id="studentTableBody" class="divide-y divide-gray-100"></tbody>
    </table>
    <p id="emptyMsg" class="text-center text-gray-400 py-8 hidden">কোনো স্টুডেন্ট পাওয়া যায়নি</p>
  </div>

  <!-- Pagination -->
  <div id="pagination" class="flex justify-center gap-2 mt-4"></div>

</main>

<!-- Add/Edit Modal -->
<div id="studentModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6">
    <h2 id="modalTitle" class="text-lg font-bold text-gray-800 mb-4">নতুন স্টুডেন্ট যোগ করুন</h2>
    <form id="studentForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <input type="hidden" id="studentId">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">নাম *</label>
        <input type="text" id="name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Roll *</label>
        <input type="text" id="roll" required class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ইমেইল</label>
        <input type="email" id="email" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ফোন</label>
        <input type="text" id="phone" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ডিপার্টমেন্ট</label>
        <input type="text" id="department" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">সেমিস্টার</label>
        <input type="text" id="semester" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">ঠিকানা</label>
        <textarea id="address" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
      </div>

      <p id="formError" class="text-red-500 text-sm sm:col-span-2 hidden"></p>

      <div class="sm:col-span-2 flex justify-end gap-3 mt-2">
        <button type="button" id="cancelBtn" class="px-4 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50">বাতিল</button>
        <button type="submit" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium">সংরক্ষণ করুন</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
