<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Student Management System</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-600 via-indigo-500 to-purple-600 flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-bold mb-3">SMS</div>
      <h1 class="text-2xl font-bold text-gray-800">Student Management System</h1>
      <p class="text-gray-500 text-sm mt-1">লগইন করে আপনার ড্যাশবোর্ডে প্রবেশ করুন</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" id="username" required
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
          placeholder="admin">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" required
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
          placeholder="••••••••">
      </div>

      <p id="errorMsg" class="text-red-500 text-sm hidden"></p>

      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">
        লগইন করুন
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      একাউন্ট নেই? <a href="register.html" class="text-indigo-600 font-medium hover:underline">রেজিস্ট্রেশন করুন</a>
    </p>

    <div class="mt-4 text-center text-xs text-gray-400 border-t pt-3">
      ডিফল্ট ডেমো লগইন: <b>admin</b> / <b>admin123</b>
    </div>
  </div>

<script src="js/api.js"></script>
<script>
  // ইতিমধ্যে লগইন থাকলে সরাসরি ড্যাশবোর্ডে পাঠাও
  if (getToken()) window.location.href = 'dashboard.html';

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.classList.add('hidden');

    try {
      const data = await loginUser(username, password);
      setToken(data.access_token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorMsg.textContent = err.message || 'লগইন ব্যর্থ হয়েছে';
      errorMsg.classList.remove('hidden');
    }
  });
</script>
</body>
</html>
