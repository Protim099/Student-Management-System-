<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Student Management System</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-600 via-indigo-500 to-purple-600 flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-bold mb-3">SMS</div>
      <h1 class="text-2xl font-bold text-gray-800">নতুন একাউন্ট তৈরি করুন</h1>
    </div>

    <form id="registerForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" id="username" required
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" required
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" required minlength="6"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <p id="errorMsg" class="text-red-500 text-sm hidden"></p>
      <p id="successMsg" class="text-green-600 text-sm hidden"></p>

      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">
        রেজিস্ট্রেশন করুন
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      আগে থেকে একাউন্ট আছে? <a href="index.html" class="text-indigo-600 font-medium hover:underline">লগইন করুন</a>
    </p>
  </div>

<script src="js/api.js"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    errorMsg.classList.add('hidden');
    successMsg.classList.add('hidden');

    try {
      await registerUser(username, email, password);
      successMsg.textContent = 'রেজিস্ট্রেশন সফল! এখন লগইন করুন...';
      successMsg.classList.remove('hidden');
      setTimeout(() => window.location.href = 'index.html', 1200);
    } catch (err) {
      errorMsg.textContent = err.message || 'রেজিস্ট্রেশন ব্যর্থ হয়েছে';
      errorMsg.classList.remove('hidden');
    }
  });
</script>
</body>
</html>
